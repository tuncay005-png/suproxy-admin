<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Custom Classes Test</title>
  <link rel="stylesheet" href="./app/globals.css">
</head>
<body class="p-8 space-y-4">
  <h1 class="text-2xl font-bold mb-4">Custom Tailwind Classes Test</h1>
  
  <!-- Premium Card -->
  <div class="premium-card p-4">
    <p>Premium Card</p>
  </div>
  
  <!-- Premium Card with Hover -->
  <div class="premium-card premium-card-hover p-4">
    <p>Premium Card with Hover Effect</p>
  </div>
  
  <!-- Chart Container -->
  <div class="chart-container">
    <p>Chart Container</p>
  </div>
  
  <!-- Navigation Items -->
  <nav class="space-y-2">
    <div class="nav-item">Nav Item</div>
    <div class="nav-item nav-item-active">Active Nav Item</div>
    <div class="nav-item nav-item-submenu">Submenu Nav Item</div>
  </nav>
  
  <!-- Status Dots -->
  <div class="flex gap-4 items-center">
    <div class="status-dot status-dot-success"></div>
    <div class="status-dot status-dot-warning"></div>
    <div class="status-dot status-dot-error"></div>
    <div class="status-dot status-dot-neutral"></div>
  </div>
  
  <!-- Interactive Card -->
  <div class="card-interactive p-4">
    <p>Interactive Card</p>
  </div>
  
  <!-- Focus Ring Test -->
  <button class="focus-ring px-4 py-2 bg-primary text-primary-foreground rounded">
    Focus Ring Button
  </button>
</body>
</html>
